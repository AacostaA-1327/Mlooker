server.port=8080

# Forzar el uso del perfil 'local' para desarrollo en máquinas locales
spring.profiles.active=local

# Configuración de Conexión a MySQL usando Variables de Entorno (Buenas prácticas de Prod)
# Si las variables no existen en el sistema, fallará por seguridad en producción.
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración de JPA / Hibernate profesional
spring.jpa.hibernate.ddl-auto=validate
# Validación en la capa web (@Valid); evita duplicar con Hibernate al persistir
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
